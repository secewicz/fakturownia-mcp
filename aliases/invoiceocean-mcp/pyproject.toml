[project]
name = "invoiceocean-mcp"
version = "0.3.0"
description = "Unofficial MCP server for InvoiceOcean invoicing (alias for fakturownia-mcp)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Krzysztof Marmol", email = "krzysztof.marmol@gmail.com" },
]
license = "MIT"
keywords = ["invoiceocean", "fakturownia", "vosfactures", "bitfactura", "mcp", "model-context-protocol", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
# Pinned exactly: this alias always mirrors one fakturownia-mcp release.
dependencies = ["fakturownia-mcp==0.3.0"]

[project.urls]
Repository = "https://github.com/KrzysztofMarmol/fakturownia-mcp"

[project.scripts]
invoiceocean-mcp = "fakturownia_mcp.server:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
