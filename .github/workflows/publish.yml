name: Release artifacts

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check tag, release dependencies, and versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import json, os, re, tomllib

          main = re.search(r'__version__ = "(.+)"', open("src/fakturownia_mcp/__init__.py").read()).group(1)
          assert os.environ["RELEASE_TAG"] == f"v{main}", (
              f"tag {os.environ['RELEASE_TAG']} != package v{main}"
          )
          release_ref = f"fakturownia-mcp @ git+https://github.com/secewicz/fakturownia-mcp.git@v{main}"
          with open("aliases/invoiceocean-mcp/pyproject.toml", "rb") as file:
              alias = tomllib.load(file)["project"]
          assert alias["version"] == main, f"alias {alias['version']} != server {main}"
          assert release_ref in alias["dependencies"], alias["dependencies"]

          manifest = json.load(open("mcpb/manifest.json"))
          assert manifest["version"] == main, f"mcpb manifest {manifest['version']} != server {main}"
          with open("mcpb/pyproject.toml", "rb") as file:
              bundle = tomllib.load(file)["project"]
          assert bundle["version"] == main, f"mcpb pyproject {bundle['version']} != server {main}"
          assert release_ref in bundle["dependencies"], bundle["dependencies"]
          print(f"tag, versions, and release dependencies in sync: {main}")
          EOF
      - run: uv build
      - run: uv build aliases/invoiceocean-mcp -o dist
      - name: Pack .mcpb bundle with audited CLI version
        run: npx --yes @anthropic-ai/mcpb@2.1.2 pack mcpb "dist/fakturownia-mcp-${GITHUB_REF_NAME#v}.mcpb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-artifacts
          path: dist
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "See CHANGELOG.md. Artifacts are built from the reviewed Git tag; the .mcpb bundle requires uv." \
              dist/*
          fi
